<script id='my_vertex_shader' type='x-shader/x-vertex'>
   attribute vec3 aPos;
   varying   vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }
</script>

<script id='my_fragment_shader' type='x-shader/x-fragment'>
uniform float uTime;
varying vec3 vPos;

 vec3 sph(vec3 V, vec4 C, vec3 W){ // center has xyz and radius, W is where
    vec3 P = V-C.xyz;
    float disc = dot(W,P) * dot(W,P) - dot(P,P) + C.w*C.w;
    vec3 S;
    float t;
    if (disc < 0.){
       S = vec3(0., 0., 0.);
       return S;
    }
    if (disc == 0.){
       t = -1. * dot(W,P);
       if (t < 0.) return vec3(-1., -1., -1.);
       S = V+t*W;
       return normalize(S-C.xyz);
    }
    float pt, mt;
    if (disc >= 0.) pt = -dot(W,P) + sqrt(disc);
    if (disc >= 0.) mt = -dot(W,P) - sqrt(disc);
    vec3 N;
    if (mt > 0. || pt > 0.){
        float t = mt > pt ? pt : mt;
        vec3 S = V+t*W;
        N = normalize(S-C.xyz);
    }
    return N;
 }

vec3 phong(vec3 E, vec3 L, vec3 N, vec3 A, vec3 D, vec3 S){
    vec3 reflection = 2. * dot(N,L) * N - L;
    float d = max(0., dot(N, normalize(L)));
    vec3 c = A;  //ambient color
    float s = pow(max(0.,dot(E,reflection)),2.);
    c += D * d + S * s;

    return c;
 }

void main() {
   float f = 0.4;
   vec4 C = vec4(0.,0.,0.,0.3*sin(uTime+1.));
   vec4 C2 = vec4(0.2,0.,0.,0.3*sin(uTime));
   vec3 V = vec3(0.,0.,f);
   vec3 W = normalize(vec3(vPos.x,vPos.y,-f));
   vec3 E = -W;
   vec3 N = sph(V,C,W);
   vec3 N2 = sph(V,C2,W);
   vec3 color;

   vec3 L = vec3(.5*sin(5.*uTime),1.,1.);

   float noisY = noise(vec3(sin(uTime),sin(uTime * 1.), sin(uTime * 3.)));
    vec3 ambient_noise = vec3(noisY, noisY * 0.5, noisY * 0.2);
    vec3 color1 = phong(E,L,normalize(N),ambient_noise,vec3(.2,1.,.2),vec3(.8,.3,.4));
    vec3 color2 = phong(E,L,normalize(N2),ambient_noise,vec3(.2,.4,.2),vec3(.8,.3,.4));

   if (N.z >= 0. && N2.z >= 0.){
        if (N.z >= N2.z){
            color = color1;
        }
        else{
            color = color2;
        }
    }
    else if (N.z >= 0.){
        color = color1;
    }
    else if (N2.z >= 0.){
        color = color2;
    }


   gl_FragColor = vec4(sqrt(color), 1.0); // both

}</script>

<script id='instructions' type='text/html'><font color=#b0b0b0>
<a href=http://blog.kenperlin.com>
<b>Lesson 28: Painting with clouds</b>
</a>
<p>
Once you have the basic texture of clouds<br>
you can start thinking in a more painterly<br>
way, varying the density of the clouds<br>
from top to bottom, and mixing different<br>
colors to create a complex palette.
<p>
We vary the cloud density by replacing<br>
<font color=white><code>c</code></font>
with
<font color=white><code>c + y</code></font>
inside the
<font color=white><code>clamp</code></font>
function.
<p>
We create colorful clouds by using
<font color=white><code>c</code></font> to<br>
mix
<font color=white><code>pink</code></font>
into the
<font color=white><code>white</code></font>
before clamping,<br>
to create the final
<font color=white><code>cloud</code></font>
color.
<p>
Things to try:
<p>
&#x25cf; Place the clouds below, not above, the sky
<br>
&#x25cf; Make the clouds slowly drift left to right
<br>
&#x25cf; Create a dark and stormy color palette
</script>
