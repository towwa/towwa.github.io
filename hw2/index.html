<!!-------- FRAGMENT SHADER: THIS IS WHERE YOU WILL DO YOUR WORK -------->

<script id='my_fragment_shader' type='x-shader/x-fragment'>
uniform float uTime;
varying vec3 vPos;

vec3 sph(float x, float y) {
  float zz = 1. - x * x - y * y;
  float sign = step(0., zz);
  float z = mix(-1., sqrt(zz), sign);
  return vec3(x, y, z);
}

void main() {
    uniform float uTime;
varying vec3 vPos;

vec3 sph(float x, float y) {
  float zz = 1. - x * x - y * y;
  float sign = step(0., zz);
  float z = mix(-1., sqrt(zz), sign);
  return vec3(x, y, z);
}

void main() {
    float f = 0.9;
    float r = 0.5;
    vec3 C = vec3(0, 0, 0); // circle center
    vec3 V = vec3(0, 0, f);
    vec3 W = normalize(vec3(vPos.x, vPos.y, -f));
    vec3 P = V-C;
    float disc = dot(W,P) * dot(W,P) - dot(P,P) + r*r;
    float pt, mt;
    if (disc >= 0.) pt = -dot(W,P) + sqrt(disc);
    if (disc >= 0.) mt = -dot(W,P) - sqrt(disc);
    vec3 N;
    if (mt > 0. || pt > 0.){
        float t = mt > pt ? pt : mt;
        vec3 S = V+t*W;
        N = normalize(S-C);
    }
  //vec3 N = sph(2.*vPos.x, 2.*vPos.y);
  vec3 L = vec3(5.*sin(uTime * 6.),1., 5. * cos(uTime * 6.));
  float c = max(0.1, dot(N, normalize(L)));
  c = step(0.1, N.z) * 0.3 * c;
  vec3 color = vec3(c, c*c, c);
  gl_FragColor = vec4(sqrt(color), 1.0);
}


}

</script>
