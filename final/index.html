<script id='my_fragment_shader' type='x-shader/x-fragment'>

 uniform float uTime;   // TIME, IN SECONDS
 uniform vec2 uMouse;   // mousePos
 uniform vec2 uPlayer;   // mousePos
 uniform vec3 uSpheres[100];
 uniform vec3 uColors[100];
 varying vec3 vPos;     // -1 < vPos.x < +1
                        // -1 < vPos.y < +1
                        //      vPos.z == 0



vec3 color = vec3(0.1, 0.1, 0.1);

vec3 circ = vec3(0.5, 0.5, 0.1);


// Used this for help: https://www.shadertoy.com/view/MdfBRX

vec2 rain(vec2 uv, float t) {

    uv*=3.;

    vec2 a = vec2(2.,1.);
    vec2 st = uv * a;

    vec2 id = floor(st);
    st.y += t*0.6;

    float noise = fract(sin(id.x * 73.33) * 728.654);
    st.y += noise;
    uv.y += noise;
    id = floor(st);
    st = fract(st) - 0.5;

    t += fract(sin(id.x*68.24 + id.y * 1433.98) * 762.35)*6.283;
    float y =-sin(t + sin(t + sin(t) * 0.5)) * 0.42;
    float x = 0.;
    vec2 p1 = vec2(x, y);
    vec2 o1 = (st-p1)/a;
    float d = length(o1);

    float s1 = smoothstep(0.07, 0.00, d);

    vec2 o2 = (fract(uv*a.x*vec2(1., 2.))-0.5)/vec2(1., 2.);
    d = length(o2);

    float s2 = smoothstep(0.3*(-st.y+0.5), 0.00, d) * smoothstep(-.1, .1, st.y-p1.y);
    //if (st.x > .46 || st.y > .49) s1 = 1.;   

    return vec2(s1 * o1 * 30. + s2 * o2 * 10.);

}

#define S(x, y, t) smoothstep(x, y, t)


struct ray {
	vec3 o, d;   
};
    
ray CameraSetup(vec2 uv, vec3 camPos, vec3 lookAt, float zoom) {
	ray cam;
    cam.o = camPos;
    
    vec3 f = normalize(lookAt-cam.o);
    vec3 r = cross(vec3(0., 1., 0.), f);
    vec3 u = cross(f, r);
    
    vec3 c = cam.o + f * zoom;
    vec3 i = c + uv.x*r + uv.y*u;
    
    cam.d = normalize(i-cam.o);
    
    return cam;
}
  

vec3 ClosestPoint(ray r, vec3 p) {
    // returns the closest point on ray r to point p
    return r.o + max(0., dot(p-r.o, r.d))*r.d;
}

float DistRay(ray r, vec3 p) {
	return length(p-ClosestPoint(r, p));
}

float Bokeh(ray r, vec3 p, float size, float blur) {
	float d = DistRay(r, p);
    float c = smoothstep(size, size*(1.-blur), d);
    c *= mix(.7, 1., smoothstep(size*.8, size, d));
    return c;
}



 void main() {

    float t = uTime;
    vec2 uv = vPos.xy;
    vec2 uv_backup = uv;
    vec3 camPos = vec3(uPlayer.y, 0., uPlayer.x);
    vec3 lookAt = vec3(uMouse.x + uPlayer.y, uMouse.y, 1. + uPlayer.x);

    uv.x += sin(uv.y*20.0)*0.01;
    uv.y += sin(uv.x*20.0)*0.01;

    vec2 distortion = rain(uv*5., uTime)*0.1; 
    distortion += rain(uv*1., uTime)*2.2;
    uv = uv_backup;

    vec3 col = vec3(0, 0, 0);

    uv.x += sin(uv.y*60.0)*0.005;
    uv.y += sin(uv.x*160.0)*0.005;
    
    ray r = CameraSetup(uv-distortion*0.5, camPos, lookAt, 1.0);

    float c = 0.;
    col = vec3(0.,0.,0.);

    for (int i = 0; i < 64; i++) {
        c = Bokeh(r, uSpheres[i], .7, 0.3);
        col += (uColors[i]) *c;
    }

    //eliptical window effect.
    uv = uv_backup;
    if (((0.0 - uv.x) * (0.0 - uv.x))/2. + (0.0 - uv.y) * (0.0 - uv.y) > 1.0) {
        col = vec3(0.05, 0.05, 0.05);
    }

    gl_FragColor = vec4(col, 1.0);

 }</script>

sphere_count = 0;

function cycleColor() {
    let chance = Math.random();
    for (let x = 0; x < sphere_count*3; x+=3) {
        let flip = Math.random();
        if (flip > chance) {
            colors[x] = 0.7 + Math.random()*0.3;
            colors[x+1] = 0.7 + Math.random()*0.3;
            colors[x+2] = 0.7 + Math.random()*0.3;
        }
    }
}

function initColor() {
    colors[0] = 0;
}

function createSphereGrid(rows, cols, lx, ly) {
    sphere_count = rows * cols;
    let dx = lx/cols;
    let dy = ly/rows;
    for(let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
            spheres.push(-1*lx/2+dx*i);
            spheres.push(-1*ly/2+dy*j);
            spheres.push(2.0+0.1*sphere_count);
            //colors.push(Math.abs(Math.sin((-1*lx/2+dx*i) * 64.32)))
            //colors.push(Math.abs(Math.sin((-1*lx/2+dy*j) * 64.32)))
            //colors.push(Math.abs(Math.sin((-1*lx/2+dx*i*j) * 64.32)))
            colors.push(1.);
            colors.push(1.);
            colors.push(1.);
        }
    }
    return;
}

function animate(gl) {

   }

   setUniform('2fv', 'uPlayer', [playerX, playerY]);
   setUniform('3fv', 'uSpheres', spheres);
   setUniform('3fv', 'uColors', colors);
}
