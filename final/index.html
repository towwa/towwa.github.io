<!!-------- FRAGMENT SHADER: THIS IS WHERE YOU WILL DO YOUR WORK -------->

<script id='my_fragment_shader' type='x-shader/x-fragment'>

 uniform float uTime;   // TIME, IN SECONDS

 varying vec3 vPos;     // -1 < vPos.x < +1
                        // -1 < vPos.y < +1
                        //      vPos.z == 0



vec3 color = vec3(0.1, 0.1, 0.1);

vec3 circ = vec3(0.5, 0.5, 0.1);


// Used this for help: https://www.shadertoy.com/view/MdfBRX

vec2 rain(vec2 uv, float t) {

    uv*=3.;

    vec2 a = vec2(3.,1.);
    vec2 st = uv * a;

    vec2 id = floor(st);
    st.y += t*0.6;
    //st.x += t*0.003 ;

    float noise = fract(sin(id.x * 73.33) * 728.654);
    st.y += noise;
    uv.y += noise;
    id = floor(st);
    st = fract(st) - 0.5;

    t += fract(sin(id.x*68.24 + id.y * 1433.98) * 762.35)*6.283;
    float y =-sin(t + sin(t + sin(t) * 0.5)) * 0.42;
    vec2 p1 = vec2(0., y);
    vec2 o1 = (st-p1)/a;
    float d = length(o1);

    float s1 = smoothstep(0.07, 0.00, d);

    vec2 o2 = (fract(uv*a.x*vec2(1., 2.))-0.5)/vec2(1., 2.);
    d = length(o2);

    float s2 = smoothstep(0.3*(-st.y+0.5), 0.00, d) * smoothstep(-.1, .1, st.y-p1.y);
    //if (st.x > .46 || st.y > .49) s1 = 1.;   

    return vec2(s1 * o1 * 30. + s2 * o2 * 10.);

}

#define S(x, y, t) smoothstep(x, y, t)


struct ray {
	vec3 o, d;   
};
    
ray CameraSetup(vec2 uv, vec3 camPos, vec3 lookAt, float zoom) {
	ray cam;
    cam.o = camPos;
    
    vec3 f = normalize(lookAt-cam.o);
    vec3 r = cross(vec3(0., 1., 0.), f);
    vec3 u = cross(f, r);
    
    vec3 c = cam.o + f * zoom;
    vec3 i = c + uv.x*r + uv.y*u;
    
    cam.d = normalize(i-cam.o);
    
    return cam;
}
  

vec3 ClosestPoint(ray r, vec3 p) {
    // returns the closest point on ray r to point p
    return r.o + max(0., dot(p-r.o, r.d))*r.d;
}

float DistRay(ray r, vec3 p) {
	return length(p-ClosestPoint(r, p));
}

float Bokeh(ray r, vec3 p, float size, float blur) {
	float d = DistRay(r, p);
    float c = smoothstep(size, size*(1.-blur), d);
    c *= mix(.7, 1., S(size*.8, size, d));
    return c;
}



 void main() {

    vec2 uv = vPos.xy;
   vec3 camPos = vec3(0., 0.2, 0.);
    vec3 lookAt = vec3(0., 0.2, 1.);

    vec2 distortion = rain(uv, uTime)*0.8; 
    distortion += rain(uv*2., uTime)*2.2; 
    
     ray r = CameraSetup(uv-distortion*0.5, camPos, lookAt, 5.0);
      vec3 p = vec3(0.,.6,5.);
   	
    float c = Bokeh(r, p, .7, .3);
	vec3 col = vec3(1.,.7, .1) *c;
    gl_FragColor = vec4(col, 1.0);

 }</script>
