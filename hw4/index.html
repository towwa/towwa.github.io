<script id='my_vertex_shader' type='x-shader/x-vertex'>
   attribute vec3 aPos;
   varying   vec3 vPos;
   void main() {
      gl_Position = vec4(aPos, 1.);
      vPos = aPos;
   }
</script>

<script id='my_fragment_shader' type='x-shader/x-fragment'>
uniform float uTime;
varying vec3  vPos;
uniform mat4  uMat;
uniform mat4 uIdentity;
uniform mat4 uTranslate;
uniform mat4 uRotatex;
uniform mat4 uRotatey;
uniform mat4 uRotatez;
uniform mat4 uScale;
uniform vec4 uS[9];

vec4 raySph(vec3 V,vec3 W,vec4 S) {// TRACE RAY
   vec3  P = S.xyz - V;            // TO SPHERE
   float b = dot(W, P);
   float d = b * b - dot(P, P) + S.w * S.w;
   float t = b - sqrt(d);
   return vec4(V + t*W, step(0.,d)*step(0.,t));
}

void main() {
   float f = 5.;                // FOCAL LENGTH
   vec3 color = vec3(0.,0.,.1); // BACKGD COLOR
   vec3 V = vec3(0., 0., f);    // CREATE RAY
   vec3 W = normalize(vec3(vPos.xy, -f));

   for (int i = 0; i < 9; i++){
       vec4 S = uS[i]; // DEFINE SPHERE

       vec3 C = S.xyz;           // SEPARATE CENTER
       float r = S.w;                 // AND RADIUS
       C = (uTranslate*uRotatex*uRotatey*uRotatez*uScale * vec4(C, 1.)).xyz;  // APPLY uMat

       vec4 P = raySph(V,W,vec4(C,r));// SHOOT RAY:
       if (P.w > 0.) {                // IF IT HITS
          vec3 N = (P.xyz - C) / r;   // DO SHADING
          vec3 L = normalize(vec3(1.,1.,1.));
          float c = .1 + .9 * max(0., dot(N, L));
         color = vec3(c+c, c, c*c);
         if (i/2*2==i)color = vec3(c, c*c, c*c);
       }
   }
   gl_FragColor = vec4(sqrt(color), 1.0);
}</script>
